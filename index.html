<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Pancang Sawit - PT GNS</title>
    <style>
        :root {
            --primary-color: #1e5631;
            --primary-hover: #143d22;
            --bg-color: #f4f7f5;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --border-color: #dcdfe6;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
        }

        .header {
            text-align: center;
            background-color: var(--primary-color);
            color: white;
            padding: 25px 15px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border: 1px solid var(--border-color);
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: 1px solid var(--primary-color);
            background: transparent;
            color: var(--primary-color);
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background: var(--primary-color);
            color: white;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        input, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        input:focus, textarea:focus {
            border-color: var(--primary-color);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn-refresh {
            width: auto;
            padding: 6px 12px;
            font-size: 12px;
            background: #27ae60;
        }

        .result-box {
            background: #eef7f1;
            border-left: 4px solid var(--primary-color);
            padding: 12px;
            border-radius: 4px;
            margin-top: 15px;
        }

        .result-box p {
            font-size: 14px;
            margin-bottom: 5px;
        }

        .result-box strong {
            font-size: 18px;
            color: var(--primary-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th, td {
            padding: 8px 10px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: #f8f9fa;
            color: var(--text-color);
            font-weight: 600;
        }

        .badge-info {
            font-size: 11px;
            color: #666;
            margin-top: 3px;
            display: block;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🌴 Kalkulator Pancang Sawit</h1>
        <p>PT. GULA NUSANTARA SUKSES</p>
    </div>

    <!-- TABEL MONITORING -->
    <div class="card">
        <div class="card-title">
            <span>📊 Monitoring Progres Blok</span>
            <button class="btn btn-refresh" onclick="loadRekapData()">🔄 Refresh Data</button>
        </div>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Blok</th>
                        <th>Total (Ha)</th>
                        <th>Selesai (Ha)</th>
                        <th>Sisa (Ha)</th>
                        <th>Progres</th>
                    </tr>
                </thead>
                <tbody id="tableRekapBody">
                    <tr>
                        <td colspan="5">Memuat data rekap...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- KALKULATOR LUAS -->
    <div class="card">
        <div class="card-title">📐 Hitung Luas Pancang (Ha)</div>
        <div class="tabs">
            <button class="tab-btn active" id="btnSeling" onclick="setMode('seling')">Mode Seling</button>
            <button class="tab-btn" id="btnRata" onclick="setMode('rata')">Mode Rata-Rata</button>
        </div>

        <div id="formSeling">
            <div class="form-group">
                <label>Jumlah Seling / Tali</label>
                <input type="number" id="inputSeling" placeholder="Contoh: 20">
            </div>
            <div class="grid-2">
                <div class="form-group">
                    <label>Titik / Seling</label>
                    <input type="number" id="titikPerSeling" value="16">
                </div>
                <div class="form-group">
                    <label>Titik / Ha</label>
                    <input type="number" id="titikPerHa1" value="143">
                </div>
            </div>
        </div>

        <div id="formRata" style="display: none;">
            <div class="form-group">
                <label>Total Titik Pancang</label>
                <input type="number" id="inputTotalTitik" placeholder="Contoh: 320">
            </div>
            <div class="form-group">
                <label>Titik / Ha</label>
                <input type="number" id="titikPerHa2" value="143">
            </div>
        </div>

        <button class="btn" onclick="hitungLuas()">Hitung Hektar (Ha)</button>

        <div class="result-box" id="resultBox" style="display: none;">
            <p>Hasil Perhitungan Borongan:</p>
            <strong id="textHasilHa">0.00 Ha</strong>
        </div>
    </div>

    <!-- FORM REKAP BORONGAN -->
    <div class="card">
        <div class="card-title">📝 Simpan Rekap Borongan</div>
        <form id="formBorongan">
            <div class="grid-2">
                <div class="form-group">
                    <label>Tanggal</label>
                    <input type="date" id="inputTanggal" required>
                </div>
                <div class="form-group">
                    <label>Nama Blok</label>
                    <!-- Input Blok + Datalist untuk Autocomplete -->
                    <input type="text" id="inputBlok" list="listBlok" placeholder="Contoh: G1" required oninput="autoFillHa()">
                    <datalist id="listBlok"></datalist>
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label>Total Luas Blok (Ha)</label>
                    <input type="number" step="0.01" id="inputTotalHaBlok" placeholder="Contoh: 25.00" required>
                    <span class="badge-info" id="infoAutoFill"></span>
                </div>
                <div class="form-group">
                    <label>Hasil Kerja (Ha)</label>
                    <input type="number" step="0.01" id="inputHasilHa" placeholder="Otomatis / Isi Luas" required>
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label>Tarif per Ha (Rp)</label>
                    <input type="number" id="inputTarifHa" placeholder="Contoh: 250000" value="250000" required>
                </div>
                <div class="form-group">
                    <label>Total Borongan (Rp)</label>
                    <input type="number" id="inputTotalBorongan" readonly placeholder="Otomatis">
                </div>
            </div>

            <div class="form-group">
                <label>Daftar Nama Pekerja (Satu nama per baris / pisah koma)</label>
                <textarea id="inputNamaPekerja" rows="4" placeholder="Agus&#10;Budi&#10;Candra" required></textarea>
            </div>

            <button type="submit" class="btn" id="btnSimpan">Simpan Rekap Borongan</button>
        </form>
    </div>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzcGId_psZtSlo_2gOG8_ZidC9O5X7UKwpFq2LhkzkKVPhJZsaIWdESdhH-t9qMd9TIDQ/exec';
    
    let currentMode = 'seling';
    let globalRekapData = []; // Menyimpan data rekap blok dari server

    // Set tanggal hari ini secara otomatis
    document.getElementById('inputTanggal').valueAsDate = new Date();

    function setMode(mode) {
        currentMode = mode;
        document.getElementById('btnSeling').classList.toggle('active', mode === 'seling');
        document.getElementById('btnRata').classList.toggle('active', mode === 'rata');
        document.getElementById('formSeling').style.display = mode === 'seling' ? 'block' : 'none';
        document.getElementById('formRata').style.display = mode === 'rata' ? 'block' : 'none';
    }

    function hitungLuas() {
        let hasilHa = 0;
        if (currentMode === 'seling') {
            const seling = parseFloat(document.getElementById('inputSeling').value) || 0;
            const titikSeling = parseFloat(document.getElementById('titikPerSeling').value) || 0;
            const titikHa = parseFloat(document.getElementById('titikPerHa1').value) || 1;
            hasilHa = (seling * titikSeling) / titikHa;
        } else {
            const totalTitik = parseFloat(document.getElementById('inputTotalTitik').value) || 0;
            const titikHa = parseFloat(document.getElementById('titikPerHa2').value) || 1;
            hasilHa = totalTitik / titikHa;
        }

        const hasilFixed = hasilHa.toFixed(2);
        document.getElementById('textHasilHa').innerText = hasilFixed + " Ha";
        document.getElementById('resultBox').style.display = 'block';
        document.getElementById('inputHasilHa').value = hasilFixed;
        hitungTotalBorongan();
    }

    function hitungTotalBorongan() {
        const hasilHa = parseFloat(document.getElementById('inputHasilHa').value) || 0;
        const tarifHa = parseFloat(document.getElementById('inputTarifHa').value) || 0;
        document.getElementById('inputTotalBorongan').value = Math.round(hasilHa * tarifHa);
    }

    document.getElementById('inputHasilHa').addEventListener('input', hitungTotalBorongan);
    document.getElementById('inputTarifHa').addEventListener('input', hitungTotalBorongan);

    // FITUR AUTO-FILL HA DARI NAMA BLOK
    function autoFillHa() {
        const inputVal = document.getElementById('inputBlok').value.trim().toUpperCase();
        const inputTotalHa = document.getElementById('inputTotalHaBlok');
        const info = document.getElementById('infoAutoFill');

        if (!inputVal) {
            info.innerText = '';
            return;
        }

        // Cari blok yang diketik di dalam data rekap
        const match = globalRekapData.find(item => item.blok.toString().toUpperCase().trim() === inputVal);

        if (match) {
            inputTotalHa.value = match.total_ha;
            info.innerText = '✨ Terisi otomatis dari database';
            info.style.color = '#1e5631';
        } else {
            info.innerText = '🆕 Blok baru (silakan isi luas blok)';
            info.style.color = '#e67e22';
        }
    }

    // MEMUAT DATA MONITORING REKAP
    function loadRekapData() {
        const tbody = document.getElementById('tableRekapBody');
        tbody.innerHTML = '<tr><td colspan="5">Memuat data rekap...</td></tr>';

        fetch(scriptURL)
            .then(res => res.json())
            .then(data => {
                globalRekapData = data; // Simpan ke variabel global
                tbody.innerHTML = '';

                const datalist = document.getElementById('listBlok');
                datalist.innerHTML = '';

                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5">Belum ada data rekap.</td></tr>';
                    return;
                }

                data.forEach(row => {
                    // Isi opsi datalist untuk rekomendasi nama blok
                    const option = document.createElement('option');
                    option.value = row.blok;
                    datalist.appendChild(option);

                    // Isi tabel monitoring
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><strong>${row.blok}</strong></td>
                        <td>${row.total_ha}</td>
                        <td>${row.selesai_ha}</td>
                        <td>${row.sisa_ha}</td>
                        <td><strong>${row.progres}</strong></td>
                    `;
                    tbody.appendChild(tr);
                });
            })
            .catch(err => {
                tbody.innerHTML = '<tr><td colspan="5" style="color:red;">Gagal memuat data rekap</td></tr>';
            });
    }

    // SIMPAN FORM REKAP
    document.getElementById('formBorongan').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = document.getElementById('btnSimpan');
        btn.disabled = true;
        btn.innerText = 'Menyimpan...';

        const namaPekerja = document.getElementById('inputNamaPekerja').value.split(/[\n,]+/).map(n => n.trim()).filter(Boolean);
        const jumlahOrang = namaPekerja.length;
        const totalBorongan = parseFloat(document.getElementById('inputTotalBorongan').value) || 0;
        const upahPerOrang = jumlahOrang > 0 ? Math.round(totalBorongan / jumlahOrang) : 0;

        const formData = new URLSearchParams();
        formData.append('tanggal', document.getElementById('inputTanggal').value);
        formData.append('blok', document.getElementById('inputBlok').value);
        formData.append('total_ha_blok', document.getElementById('inputTotalHaBlok').value);
        formData.append('hasil_ha', document.getElementById('inputHasilHa').value);
        formData.append('tarif_ha', document.getElementById('inputTarifHa').value);
        formData.append('total_borongan', totalBorongan);
        formData.append('jumlah_orang', jumlahOrang);
        formData.append('upah_per_orang', upahPerOrang);
        formData.append('nama_pekerja', document.getElementById('inputNamaPekerja').value);

        fetch(scriptURL, {
            method: 'POST',
            body: formData
        })
        .then(res => res.text())
        .then(res => {
            alert('✅ Data borongan berhasil disimpan!');
            document.getElementById('formBorongan').reset();
            document.getElementById('inputTanggal').valueAsDate = new Date();
            document.getElementById('resultBox').style.display = 'none';
            document.getElementById('infoAutoFill').innerText = '';
            loadRekapData();
        })
        .catch(err => {
            alert('❌ Gagal menyimpan data: ' + err);
        })
        .finally(() => {
            btn.disabled = false;
            btn.innerText = 'Simpan Rekap Borongan';
        });
    });

    // Load data rekap saat halaman pertama kali dibuka
    loadRekapData();
</script>

</body>
</html>
